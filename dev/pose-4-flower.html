<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:440px;height:520px;background:#2e2e2e;display:flex;align-items:center;justify-content:center;}
  svg{width:400px;height:auto;overflow:visible;}
  .snc-char-shadow{fill:rgba(0,0,0,0.35);}
  .snc-char-grain{opacity:0.18;mix-blend-mode:multiply;}
  .snc-char-limbs path{fill:none;stroke:#2b2b2b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
  .snc-char-face circle{fill:#2b2b2b;}
  .snc-char-face path{fill:none;stroke:#2b2b2b;stroke-width:2.5;stroke-linecap:round;}
  .snc-char-prop line{stroke:#4a7a3a;stroke-width:2.5;stroke-linecap:round;}
  .snc-char-flower-center{fill:#f2c14e;}
  .snc-char-flower-petal{fill:#f2789f;}
</style>
</head><body>
<svg viewBox="0 0 220 260" role="img" aria-label="Holding a flower pose">
  <defs>
    <linearGradient id="charGradFlower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d1f1c1"/>
      <stop offset="100%" stop-color="#6f8b6f"/>
    </linearGradient>
    <filter id="charSoftBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="charShadowBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="charGrain" patternUnits="userSpaceOnUse" width="60" height="60">
      <image href="../images/grain-texture.png" width="60" height="60"/>
    </pattern>
  </defs>
  <ellipse class="snc-char-shadow" cx="110" cy="232" rx="46" ry="9" filter="url(#charShadowBlur)"></ellipse>
  <g>
    <circle class="snc-char-body" cx="110" cy="128" r="50" fill="url(#charGradFlower)" filter="url(#charSoftBlur)"></circle>
    <circle class="snc-char-grain" cx="110" cy="128" r="50" fill="url(#charGrain)" filter="url(#charSoftBlur)"></circle>
    <g class="snc-char-limbs">
      <path d="M72,108 L58,145 L50,175"></path>
      <path d="M148,108 L140,140 L118,150"></path>
      <path d="M90,178 L85,230"></path>
      <path d="M130,178 L135,230"></path>
    </g>
    <g class="snc-char-face">
      <circle cx="95" cy="118" r="4"></circle>
      <circle cx="125" cy="118" r="4"></circle>
      <path d="M95,138 Q110,150 125,138"></path>
    </g>
    <g class="snc-char-prop">
      <line x1="118" y1="150" x2="118" y2="168"></line>
      <circle cx="118" cy="147" r="4.5" class="snc-char-flower-center"></circle>
      <ellipse cx="110" cy="140" rx="4.5" ry="6" class="snc-char-flower-petal"></ellipse>
      <ellipse cx="126" cy="140" rx="4.5" ry="6" class="snc-char-flower-petal"></ellipse>
      <ellipse cx="118" cy="134" rx="6" ry="4.5" class="snc-char-flower-petal"></ellipse>
      <ellipse cx="112" cy="150" rx="5" ry="4" class="snc-char-flower-petal"></ellipse>
      <ellipse cx="124" cy="150" rx="5" ry="4" class="snc-char-flower-petal"></ellipse>
    </g>
  </g>
</svg>
</body></html>
