<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:440px;height:520px;background:#2e2e2e;display:flex;align-items:center;justify-content:center;}
  svg{width:400px;height:auto;overflow:visible;}
  .snc-char-shadow{fill:rgba(0,0,0,0.35);}
  .snc-char-grain{opacity:0.18;mix-blend-mode:multiply;}
  .snc-char-limbs path{fill:none;stroke:#2b2b2b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
  .snc-char-face circle{fill:#2b2b2b;}
  .snc-char-face path{fill:none;stroke:#2b2b2b;stroke-width:2.5;stroke-linecap:round;}
</style>
</head><body>
<svg viewBox="0 0 220 260" role="img" aria-label="Sad pose">
  <defs>
    <linearGradient id="charGradSad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c1d1f1"/>
      <stop offset="100%" stop-color="#6f798b"/>
    </linearGradient>
    <filter id="charSoftBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="charShadowBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="charGrain" patternUnits="userSpaceOnUse" width="60" height="60">
      <image href="../images/grain-texture.png" width="60" height="60"/>
    </pattern>
  </defs>
  <ellipse class="snc-char-shadow" cx="110" cy="232" rx="46" ry="9" filter="url(#charShadowBlur)"></ellipse>
  <g transform="rotate(-6 110 160)">
    <circle class="snc-char-body" cx="110" cy="128" r="50" fill="url(#charGradSad)" filter="url(#charSoftBlur)"></circle>
    <circle class="snc-char-grain" cx="110" cy="128" r="50" fill="url(#charGrain)" filter="url(#charSoftBlur)"></circle>
    <g class="snc-char-limbs">
      <path d="M68,110 L60,150 L58,185"></path>
      <path d="M145,110 L150,150 L150,185"></path>
      <path d="M95,178 L92,230"></path>
      <path d="M122,178 L120,230"></path>
    </g>
    <g class="snc-char-face">
      <circle cx="90" cy="120" r="3.6"></circle>
      <circle cx="112" cy="120" r="3.6"></circle>
      <path d="M92,140 Q106,130 120,140"></path>
    </g>
  </g>
</svg>
</body></html>
